<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pink Hive - Team Chat</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #fff5f9;
        height: 100vh;
        display: flex;
    }

    /* LEFT SIDEBAR */

    .sidebar {
        width: 260px;
        background: white;
        border-right: 1px solid #eee;
        padding: 25px;
    }

    .logo {
        font-size: 24px;
        font-weight: bold;
        color: #e75480;
        margin-bottom: 35px;
    }

    .sidebar h3 {
        color: #777;
        font-size: 14px;
    }

    .member {
        padding: 12px;
        margin: 8px 0;
        border-radius: 12px;
        cursor: pointer;
    }

    .member:hover {
        background: #fff0f6;
    }

    .online {
        color: #35a853;
        font-size: 12px;
    }

    .back {
        display: block;
        margin-top: 40px;
        color: #e75480;
        text-decoration: none;
        font-weight: bold;
    }

    /* CHAT AREA */

    .chat-area {
        flex: 1;
        display: flex;
        flex-direction: column;
    }

    .chat-header {
        background: white;
        padding: 20px 30px;
        border-bottom: 1px solid #eee;
    }

    .chat-header h2 {
        margin: 0;
        color: #333;
    }

    .chat-header p {
        margin: 5px 0 0;
        color: #777;
    }

    /* MESSAGES */

    .messages {
        flex: 1;
        padding: 30px;
        overflow-y: auto;
    }

    .message {
        margin-bottom: 20px;
        max-width: 65%;
    }

    .sender {
        font-size: 13px;
        color: #777;
        margin-bottom: 5px;
    }

    .bubble {
        display: inline-block;
        padding: 12px 16px;
        border-radius: 15px;
        background: white;
        box-shadow: 0 3px 10px rgba(0,0,0,0.05);
    }

    .my-message {
        margin-left: auto;
        text-align: right;
    }

    .my-message .bubble {
        background: #ffd6e7;
    }

    /* MESSAGE INPUT */

    .input-area {
        background: white;
        padding: 18px;
        display: flex;
        gap: 10px;
        border-top: 1px solid #eee;
    }

    .input-area input {
        flex: 1;
        padding: 14px;
        border: 1px solid #ddd;
        border-radius: 12px;
        font-size: 15px;
        outline: none;
    }

    .input-area button {
        padding: 14px 22px;
        border: none;
        border-radius: 12px;
        background: #e75480;
        color: white;
        cursor: pointer;
        font-size: 15px;
    }

    .input-area button:hover {
        opacity: 0.9;
    }

</style>
```

</head>

<body>

```
<!-- LEFT SIDEBAR -->

<div class="sidebar">

    <div class="logo">
        🐝 Pink Hive
    </div>

    <h3>TEAM MEMBERS</h3>

    <div class="member">
        🟢 Alex
        <div class="online">Online</div>
    </div>

    <div class="member">
        🟢 Sarah
        <div class="online">Online</div>
    </div>

    <div class="member">
        🟢 Maya
        <div class="online">Online</div>
    </div>

    <div class="member">
        ⚪ Emma
        <div class="online">Offline</div>
    </div>

    <a href="dashboard.html" class="back">
        ← Dashboard
    </a>

</div>


<!-- CHAT -->

<div class="chat-area">


    <div class="chat-header">

        <h2>💬 Hive Chat</h2>

        <p>
            Team communication space 🐝💗
        </p>

    </div>


    <!-- MESSAGES -->

    <div class="messages" id="messages">


        <div class="message">

            <div class="sender">
                Alex
            </div>

            <div class="bubble">
                Hey everyone! 👋
            </div>

        </div>


        <div class="message">

            <div class="sender">
                Sarah
            </div>

            <div class="bubble">
                Heyy! Are we ready for today's meeting? 💗
            </div>

        </div>


        <div class="message my-message">

            <div class="sender">
                You
            </div>

            <div class="bubble">
                Yes! I'll prepare the presentation 🐝✨
            </div>

        </div>


    </div>


    <!-- INPUT -->

    <div class="input-area">

        <input
            type="text"
            id="messageInput"
            placeholder="Type a message..."
            onkeydown="handleEnter(event)"
        >

        <button onclick="sendMessage()">
            Send 💗
        </button>

    </div>


</div>


<script>

    function sendMessage() {

        const input =
            document.getElementById("messageInput");

        const message =
            input.value.trim();

        if (message === "") {
            return;
        }


        const messages =
            document.getElementById("messages");


        const newMessage =
            document.createElement("div");

        newMessage.className =
            "message my-message";


        newMessage.innerHTML = `

            <div class="sender">
                You
            </div>

            <div class="bubble">
                ${message}
            </div>

        `;


        messages.appendChild(newMessage);


        input.value = "";


        messages.scrollTop =
            messages.scrollHeight;

    }


    function handleEnter(event) {

        if (event.key === "Enter") {

            sendMessage();

        }

    }

</script>
```

</body>

</html>
